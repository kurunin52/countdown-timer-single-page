<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Countdown Timer - Single Page</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Hyperscript -->
  <script src="https://unpkg.com/hyperscript.org@0.9.10"></script>
</head>
<body id="app" data-running="false">
  <main class="card">
    <h1>カウントダウンタイマー</h1>

    <div class="controls">
      <label>
        開始カウント:
        <input id="start-value" type="number" min="0" value="60">
      </label>

      <label>
        間隔 (秒):
        <input id="interval-value" type="number" min="0.1" step="0.1" value="1">
      </label>
    </div>

    <div class="display-area">
      <div id="display" class="display">60</div>
      <div id="status" class="status">Ready</div>
    </div>

    <div class="buttons">
      <button id="start" class="btn" _="on click
        set the value of #remaining to the value of #start-value
        put the value of #remaining into #display
        set the data-running of #app to 'true'
        put '' into #status
        every (the value of #interval-value)s while the data-running of #app is 'true'
          if the value of #remaining > 0
            add -1 to the value of #remaining
            put the value of #remaining into #display
          else
            put 'Done' into #status
            set the data-running of #app to 'false'
            break
      ">Start</button>

      <button id="stop" class="btn" _="on click
        set the data-running of #app to 'false'
        put 'Stopped' into #status
      ">Stop</button>

      <button id="reset" class="btn" _="on click
        set the value of #remaining to the value of #start-value
        put the value of #remaining into #display
        set the data-running of #app to 'false'
        put 'Ready' into #status
      ">Reset</button>
    </div>

    <!-- hidden state holder -->
    <input id="remaining" type="number" value="60" hidden>

    <footer class="note">
      このシングルページは Hyperscript によるカウントダウンを実装しています。GitHub Pages で公開できます。
    </footer>
  </main>

  <!-- 初期表示のセット（Hyperscript でも可能だが、ここでは軽く初期化） -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('display').textContent = document.getElementById('remaining').value;
    });
  </script>
</body>
</html>
