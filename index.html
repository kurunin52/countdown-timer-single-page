<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Countdown Timer - Single Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body id="app">
  <main class="card">
    <h1>カウントダウンタイマー</h1>

    <details class="settings">
      <summary>設定を表示</summary>
      <div class="controls">
        <label>
          開始カウント:
          <input id="start-value" type="number" min="1" value="60">
        </label>
      </div>
    </details>

    <div class="controls always-visible">
      <label>
        合計経過秒数:
        <input id="total-duration" type="number" min="1" step="1" value="60">
      </label>
    </div>

    <div class="display-area">
      <div id="display" class="display">00:01:00</div>
      <div id="status" class="status">Ready</div>
    </div>

    <div class="buttons">
      <button id="start" class="btn">Start</button>
      <button id="stop" class="btn">Stop</button>
      <button id="reset" class="btn">Reset</button>
    </div>

    <footer class="note">
      このシングルページは純粋な JavaScript によるカウントダウンで、合計秒数を指定して開始カウントを与えた数値をその秒数で減らします。
    </footer>
  </main>

  <script>
    // utility: format seconds as HH:MM:SS
    function pad(n) { return String(n).padStart(2, '0'); }
    function formatTime(totalSeconds) {
      var s = Math.max(0, Math.floor(Number(totalSeconds) || 0));
      var hours = Math.floor(s / 3600);
      var minutes = Math.floor((s % 3600) / 60);
      var seconds = s % 60;
      return pad(hours) + ':' + pad(minutes) + ':' + pad(seconds);
    }

    document.addEventListener('DOMContentLoaded', function () {
      var startValueEl = document.getElementById('start-value');
      var totalDurationEl = document.getElementById('total-duration');
      var displayEl = document.getElementById('display');
      var statusEl = document.getElementById('status');
      var startBtn = document.getElementById('start');
      var stopBtn = document.getElementById('stop');
      var resetBtn = document.getElementById('reset');

      var remaining = parseInt(startValueEl.value, 10) || 60;
      var timerId = null;

      function updateDisplay() {
        displayEl.textContent = formatTime(remaining);
      }

      // initial
      updateDisplay();

      function computeIntervalSeconds() {
        var total = Math.max(0, Number(totalDurationEl.value) || 0);
        var count = Math.max(1, parseInt(startValueEl.value, 10) || 60);
        // interval in seconds between decrements
        return total / count;
      }

      startBtn.addEventListener('click', function () {
        // reset remaining to start value
        remaining = Math.max(0, parseInt(startValueEl.value, 10) || 60);
        updateDisplay();
        statusEl.textContent = '';

        var intervalSec = computeIntervalSeconds();
        if (intervalSec <= 0) {
          statusEl.textContent = 'Invalid total duration';
          return;
        }

        // clear any existing timer
        if (timerId !== null) {
          clearInterval(timerId);
          timerId = null;
        }

        // use setInterval with millisecond precision
        var intervalMs = Math.max(10, Math.round(intervalSec * 1000));

        timerId = setInterval(function () {
          if (remaining > 0) {
            remaining -= 1;
            updateDisplay();
          } else {
            clearInterval(timerId);
            timerId = null;
            statusEl.textContent = 'Done';
          }
        }, intervalMs);
      });

      stopBtn.addEventListener('click', function () {
        if (timerId !== null) {
          clearInterval(timerId);
          timerId = null;
          statusEl.textContent = 'Stopped';
        }
      });

      resetBtn.addEventListener('click', function () {
        if (timerId !== null) {
          clearInterval(timerId);
          timerId = null;
        }
        remaining = Math.max(0, parseInt(startValueEl.value, 10) || 60);
        updateDisplay();
        statusEl.textContent = 'Ready';
      });

      // if start-value or total-duration changed while running, the next Start will use new values
    });
  </script>
</body>
</html>
